name: juju-norma
base: bare
build-base: ubuntu@24.04
version: "0.1.0"
summary: Chiselled ROCK with Go calibration binary
description: |
  Minimal OCI image for the norma-k8s calibration charm workload.
  Contains only the statically compiled Norma Go binary and Pebble.
  Built with CGO_ENABLED=0 for a fully static, distroless image.
license: Apache-2.0

platforms:
  amd64:
  arm64:

run_user: _daemon_

services:
  norma:
    override: replace
    command: /bin/norma
    startup: enabled

parts:
  busybox:
    # Vendor the busybox-static binary directly instead of using the
    # `busybox_bins` chisel slice. Chisel's slice manifest is pinned
    # to a specific Ubuntu archive snapshot and the GitHub-hosted
    # runner's mirror tends to drift past that snapshot, breaking the
    # build with a digest mismatch. `build-packages` uses normal apt
    # in the build VM (no digest pinning), which is mirror-tolerant.
    plugin: nil
    build-packages:
      - busybox-static
    override-build: |
      install -D -m 0755 /bin/busybox "${CRAFT_PART_INSTALL}/usr/bin/busybox"
    override-prime: |
      craftctl default
      # Create /bin/sh symlink for juju exec/ssh shell support (FR-038)
      mkdir -p "${CRAFT_PRIME}/bin"
      if [ ! -e "${CRAFT_PRIME}/bin/sh" ]; then
        ln -s /usr/bin/busybox "${CRAFT_PRIME}/bin/sh"
      fi

  tmp-dir:
    plugin: nil
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/tmp
      chmod 1777 ${CRAFT_PART_INSTALL}/tmp
    stage:
      - tmp

  norma:
    plugin: go
    source: workload/
    build-snaps:
      # Match workload/go.mod's `go` directive (>= 1.23.0). With go/1.22 the
      # build only succeeded via Go's auto-toolchain download of 1.23 at pack
      # time — fragile and slow; pin the matching snap channel instead.
      - go/1.23/stable
    build-environment:
      - CGO_ENABLED: "0"
      - GOFLAGS: "-trimpath"
    go-buildtags:
      - osusergo
      - netgo
    override-build: |
      export GOARCH=${CRAFT_ARCH_BUILD_FOR:-amd64}
      # Bake a per-build version into the binary so each published OCI resource
      # revision is runtime-distinguishable (the charm's get-version action execs
      # `norma --version`). CI writes workload/version.txt = the image tag base
      # (e.g. main-<sha> / <semver>) before packing; absent (local pack) -> "dev".
      VER="$(cat "${CRAFT_PART_SRC}/version.txt" 2>/dev/null || cat version.txt 2>/dev/null || echo dev)"
      echo "Building norma binary with version=${VER}"
      go build -o ${CRAFT_PART_INSTALL}/bin/norma -tags "osusergo,netgo" -ldflags="-s -w -X main.version=${VER}" ./...
    stage:
      - bin/norma
