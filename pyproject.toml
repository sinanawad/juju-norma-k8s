[project]
name = "juju-norma-k8s"
version = "0.1.0"
description = "Juju K8s calibration charm exercising all charm features"
requires-python = ">=3.12"
dependencies = [
    "ops",
    "cosl",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "ops[testing]",
    "pytest",
    "coverage[toml]",
    "jubilant",
    "ruff",
]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "lib"]
# A K8s-limitation xfail that starts passing (Juju shipped the fix) becomes a
# loud CI failure instead of a silent XPASS — for a calibration charm the
# per-channel pass/fail record is the product, so a flipped capability must
# surface. Mark genuinely-unknown cases with `xfail(strict=False)` explicitly.
xfail_strict = true
markers = [
    "smoke: minimal fast integration subset run on PRs/pushes (deploy+active, lifecycle events, one config change, one peer-relation read).",
]
