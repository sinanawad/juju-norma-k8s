type: charm
name: juju-norma-k8s
title: Juju K8s Calibration Charm
summary: A k8s calibration charm to exercise all charm features
description: |
  A comprehensive calibration charm for Juju CI that exercises all features
  and capabilities relevant to Kubernetes charms. Each feature is testable
  independently via dedicated actions.

base: ubuntu@24.04
platforms:
  amd64:
  arm64:

parts:
  norma-charm:
    plugin: uv
    source: .
    build-packages: [git]
    build-snaps: [astral-uv]
    override-build: |
      craftctl default
      git describe --always > $CRAFT_PART_INSTALL/version
      cp $CRAFT_PART_SRC/icon.svg $CRAFT_PART_INSTALL/icon.svg

assumes:
  - juju >= 3.6
  - k8s-api

containers:
  norma:
    resource: juju-norma-image
    uid: 584792
    gid: 584792
    mounts:
      - storage: data
        location: /var/lib/norma
      - storage: logs
        location: /var/log/norma
  norma-secondary:
    resource: juju-norma-image
    uid: 584792
    gid: 584792

resources:
  juju-norma-image:
    type: oci-image
    upstream-source: ghcr.io/sinanawad/juju-norma:latest
    description: Chiselled ROCK with Go calibration binary

storage:
  data:
    type: filesystem
    minimum-size: 1G
  logs:
    type: filesystem
    minimum-size: 512M
    multiple-range: 0-1

config:
  options:
    calibration-string:
      type: string
      default: "default"
      description: Calibration string config (tests string type handling)
    calibration-int:
      type: int
      default: 8080
      description: Calibration integer config (tests int type, also workload port)
    calibration-float:
      type: float
      default: 1.0
      description: Calibration float config (tests float type handling)
    calibration-bool:
      type: boolean
      default: true
      description: Calibration boolean config (tests boolean type handling)
    calibration-secret:
      type: secret
      description: Calibration secret config (tests secret URI resolution)
    bad-behavior-mode:
      type: string
      default: "none"
      description: |
        Simulate a specific bad-behavior pattern for testing the Juju
        Advisor. The default 'none' preserves the
        charm's well-behaved baseline (used by its own CI). Other values
        deliberately misbehave so multiple instances of this charm can
        be deployed under different modes for observatory demos.

        Recognised values:
          - none: well-behaved baseline (default).
          - active-with-message: emit ActiveStatus carrying a non-empty
            workload message. Violates §4c.2 ("active conventionally
            carries no message"). Detected by v1 advisor Signal 1.
          - blocked-no-message: emit BlockedStatus with empty Info.
            Violates §4c.2 ("blocked MUST carry an actionable message").
            Forward-looking detector candidate.
          - stuck-maintenance: hold MaintenanceStatus indefinitely.
            Violates the §4c.2 derivation that maintenance is for
            long-running but bounded work. Forward-looking.
          - status-churn: alternate workload status between active and
            waiting on every reconcile. Violates §4c.2 stability.
            Forward-looking.
          - hook-error: raise an uncaught exception inside _reconcile,
            driving the unit to error status. Violates §4c.1 (hooks
            must complete). Forward-looking. To recover: set this
            config back to 'none' and run `juju resolve <unit>`.
          - secret-in-relation: leader writes a plaintext "password"
            key into the calibration-provider relation databag.
            Violates §4c.4 ("cryptographic material in plaintext
            relation data" anti-pattern). Forward-looking, only visible
            when an integration is established on calibration-provider.
          - stuck-dying: the unit deploys cleanly (mode does NOT raise
            during install/start), but the FIRST departure hook
            (relation-broken, stop, or remove) raises an uncaught
            exception during `juju remove-application`. The unit stays
            in Life=Dying with agent=failed indefinitely. Violates
            §4c.1 (hooks must complete) during teardown. Detected by
            the `entity-stuck-dying` advisor detector once the unit
            has been wedged for 5+ minutes. To recover: set this
            config back to 'none', run `juju resolve <unit>` to retry
            the failed teardown hook, then `juju remove-application
            <app>` should complete normally.

        Any unrecognised value falls back to compliant behaviour
        with a stderr-logged warning.

actions:
  get-event-log:
    description: Return the in-memory event ledger
    params:
      limit:
        type: integer
        description: Maximum number of entries to return (0 = all)
        default: 0
      event-filter:
        type: string
        description: Filter by event name substring (empty = no filter)
        default: ""
  get-config:
    description: Return current effective configuration
  set-status:
    description: Force a specific status condition for testing
    params:
      status:
        type: string
        description: "Status type: active, blocked, waiting, maintenance"
      message:
        type: string
        description: Status message (empty for ActiveStatus)
        default: ""
    required: [status]
  get-peer-data:
    description: Return peer relation data from all units
  get-relation-data:
    description: Return relation data for a specific endpoint
    params:
      endpoint:
        type: string
        description: Relation endpoint name
      relation-id:
        type: integer
        description: Specific relation ID (optional, returns all if omitted)
    required: [endpoint]
  get-cluster-info:
    description: Return cluster membership information
  get-secret-info:
    description: Return info about the app-owned secret
  check-storage:
    description: Check storage status and data integrity
    params:
      name:
        type: string
        description: "Storage name to check: data or logs"
        default: data
  test-pebble-ops:
    description: Run full Pebble file/exec/service operation suite
    params:
      container:
        type: string
        description: Container name
        default: norma
  trigger-notice:
    description: |
      Send a Pebble custom notice. With via=api (default) the charm records the
      notice through its own Pebble client (agent uid), so Juju's noticer
      delivers the pebble-custom-notice event to the charm. With via=workload
      the notice is recorded from inside the workload container (workload uid);
      Juju <=4.0.12 does NOT deliver those because its uniter noticer omits
      `Users: all` (see tests/integration/test_notices.py).
    params:
      key:
        type: string
        description: Notice key
        default: norma.dev/calibration-test
      data:
        type: string
        description: JSON-encoded key-value data payload
        default: "{}"
      via:
        type: string
        description: "How the notice is recorded: 'api' (charm/agent uid, dispatches) or 'workload' (workload uid)."
        default: api
        enum: [api, workload]
  toggle-health:
    description: Toggle the workload health endpoint between healthy/unhealthy
    params:
      container:
        type: string
        description: Container name
        default: norma
  test-networking:
    description: Report open ports and network binding information
  check-security:
    description: "Report security posture: UID/GID, trust, credentials"
  get-version:
    description: Return charm and workload version
  fail-action:
    description: Intentionally fail with a given message (tests error reporting)
    params:
      message:
        type: string
        description: Failure message
        default: Intentional failure for testing
  test-defer:
    description: Arm event deferral for the next eligible event
    params:
      arm:
        type: boolean
        description: true to arm deferral, false to disarm
        default: true
  run-check:
    description: Validate a specific charm capability and return pass/fail
    params:
      check:
        type: string
        description: "Capability to check (e.g., pebble, config, relations)"
    required: [check]
  introspect:
    description: Return comprehensive structured report of all internal charm state
    params:
      sections:
        type: string
        description: "Comma-separated section filter (e.g., config,leadership). Empty = all sections."
        default: ""

peers:
  norma-peers:
    interface: norma_peers

provides:
  calibration-provider:
    interface: calibration
    optional: true
  metrics-endpoint:
    interface: prometheus_scrape
    optional: true
  grafana-dashboard:
    interface: grafana_dashboard
    optional: true
  juju-info:
    interface: juju-info
    optional: true

requires:
  calibration-requirer:
    interface: calibration
    optional: true
    limit: 1
  log-proxy:
    interface: loki_push_api
    optional: true
    limit: 1

charm-libs:
  - lib: prometheus-k8s.prometheus_scrape
    version: "0"
  - lib: grafana-k8s.grafana_dashboard
    version: "0"
  - lib: loki-k8s.loki_push_api
    version: "1"

charm-user: non-root

links:
  source:
    - https://github.com/sinanawad/juju-norma-k8s
  issues:
    - https://github.com/sinanawad/juju-norma-k8s/issues
