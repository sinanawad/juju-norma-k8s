# Juju Action Contract: introspect
# This defines the action schema to be added to charmcraft.yaml

introspect:
  description: >-
    Return a comprehensive structured report of all internal charm state
    including event ledger, configuration, relations, storage, containers,
    leadership, secrets metadata, version, and unit identity. Designed for
    CI pipeline consumption.
  params:
    sections:
      type: string
      description: >-
        Comma-separated list of section names to include in the report.
        Valid sections: identity, version, leadership, config, event-ledger,
        relations, storage, containers, secrets. If omitted, all sections
        are returned.
      default: ""
  # No required params — all sections returned by default
