version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  # `uv` ecosystem (GA 2025-03) updates pyproject.toml AND uv.lock; the old
  # `pip` ecosystem left uv.lock stale — and CI now runs `uv sync --frozen` +
  # `uv lock --check`, so a stale lock is a real drift/break risk.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /workload
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(workload)"
