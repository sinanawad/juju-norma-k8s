name: Publish ROCK

# Reusable: builds the chiselled OCI image (ROCK) for both amd64 and arm64 from
# one commit, pushes each architecture under a per-arch tag, then assembles a
# multi-arch manifest list so consumers can pull a single image reference that
# resolves to the correct platform.
#
# Called by publish-edge.yaml (edge: base = main-<short-sha>) and
# release-tag.yaml (v* tags: base = <version>), so the image is always built in
# the same run, and from the same commit, as the charm it ships with.
#
# Tags produced:
#   ghcr.io/<owner>/juju-norma:<base>          multi-arch manifest list
#   ghcr.io/<owner>/juju-norma:<base>-<arch>   per-arch images (kept so a future
#                                               regen can re-reference them)
#   ghcr.io/<owner>/juju-norma:latest          moved to this build if `latest` (edge
#                                               builds only: a release of an older
#                                               tag must not move it backwards)
# Consumers of a specific build should use <base>: :latest moves.

on:
  workflow_call:
    inputs:
      sha:
        description: Commit to build.
        required: true
        type: string
      base:
        description: Image tag base (main-<short-sha> or <version>); also baked into the binary.
        required: true
        type: string
      latest:
        description: Also move the :latest tag to this build.
        required: false
        type: boolean
        default: false
    outputs:
      image:
        description: The pushed multi-arch image, by its immutable <base> tag.
        value: ${{ jobs.manifest.outputs.image }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/juju-norma
  BASE: ${{ inputs.base }}

jobs:
  build:
    name: Build ROCK (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the per-arch images to ghcr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Setup LXD
        timeout-minutes: 15
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1

      - name: Install rockcraft
        timeout-minutes: 10
        run: sudo snap install rockcraft --classic

      - name: Stamp build version
        # Bake the image tag base into the binary so the running workload reports
        # exactly which OCI resource revision it is — the charm's get-version action
        # execs `norma --version`. rockcraft reads workload/version.txt.
        run: |
          echo "$BASE" > workload/version.txt
          echo "Stamped workload version: $BASE"

      - name: Pack ROCK
        timeout-minutes: 20
        run: rockcraft pack --platform ${{ matrix.arch }}

      - name: Log in to ghcr.io
        timeout-minutes: 5
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | rockcraft.skopeo login --username "$ACTOR" \
            --password-stdin "$REGISTRY"

      - name: Push per-arch ROCK
        timeout-minutes: 10
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ROCK_FILE=$(ls *.rock | head -1)
          rockcraft.skopeo --insecure-policy copy \
            "oci-archive:${ROCK_FILE}" \
            "docker://${REGISTRY}/${IMAGE_NAME}:${BASE}-${ARCH}"

  manifest:
    name: Assemble multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write      # push the manifest list + the attestation to ghcr
      id-token: write       # OIDC token for build-provenance signing
      attestations: write   # record the provenance attestation
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - name: Log in to ghcr.io
        timeout-minutes: 5
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create + push manifest list (${{ inputs.base }})
        timeout-minutes: 5
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:${BASE}" \
            "${REGISTRY}/${IMAGE_NAME}:${BASE}-amd64" \
            "${REGISTRY}/${IMAGE_NAME}:${BASE}-arm64"

      - name: Tag as latest
        if: inputs.latest
        timeout-minutes: 5
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            "${REGISTRY}/${IMAGE_NAME}:${BASE}-amd64" \
            "${REGISTRY}/${IMAGE_NAME}:${BASE}-arm64"

      - name: Verify multi-arch manifest
        timeout-minutes: 5
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${BASE}" \
            | tee inspect.txt
          grep -q "linux/amd64" inspect.txt
          grep -q "linux/arm64" inspect.txt
          echo "Multi-arch manifest verified: amd64 + arm64 present"

      - name: Capture pushed image digest
        timeout-minutes: 5
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${BASE}" \
            --format '{{ .Manifest.Digest }}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}:${BASE}" >> "$GITHUB_OUTPUT"
          echo "Image ${REGISTRY}/${IMAGE_NAME}:${BASE} digest: $digest"

      - name: Attest build provenance (ROCK image)
        timeout-minutes: 5
        # Cryptographically signed SLSA provenance for the pushed multi-arch
        # image, stored alongside it in ghcr; verify with `gh attestation verify
        # oci://<ref> --owner <owner>`.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
