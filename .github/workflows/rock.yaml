name: Workload Tests

# Go tests on the Norma workload binary. Triggers only when the
# workload or its packaging file changes — the rest of the repo
# doesn't affect the binary.
#
# Note: ROCK packing happens in publish-rock.yaml (on main + tag,
# multi-arch, pushes to ghcr.io) and in ci.yaml's build-rock job
# (on every PR, single-arch, uploaded as an artifact for the
# integration job). This file used to also pack a ROCK as an
# artifact-only job — that was redundant and has been removed.

on:
  push:
    branches: [main]
    paths:
      - "workload/**"
      - "rockcraft.yaml"
  pull_request:
    branches: [main]
    paths:
      - "workload/**"
      - "rockcraft.yaml"

permissions:
  contents: read

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          # Single source of truth: read the version straight from go.mod so a
          # Dependabot bump to the `go` directive can't drift from the toolchain
          # CI installs (go.mod already requires >= 1.23.0). Avoids relying on
          # Go's auto-toolchain download to silently paper over a stale pin.
          go-version-file: workload/go.mod
          cache-dependency-path: workload/go.sum
      - name: Build
        working-directory: workload
        run: CGO_ENABLED=0 go build -o norma ./...
      - name: Test
        working-directory: workload
        run: go test -v ./...
