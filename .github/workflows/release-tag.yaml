name: Release (tag)

# On a git tag `v*`:
#   1. Wait until latest/edge carries the tagged commit (scripts/charmhub-edge.sh
#      edge-carries), then promote it to latest/candidate and check it landed.
#      The promotion preserves the revision number and attached resources,
#      so the exact bits already validated on edge flow to candidate.
#   2. Pack the PRINCIPAL charm and the SUDOER variant FROM THE TAGGED COMMIT.
#      Sudoer is never published to CharmHub per the hybrid distribution model.
#   3. Cut a GitHub Release with both .charm files (packed from the tag in
#      step 2 — coherent, no CharmHub round-trip) and SHA256SUMS, all
#      SLSA-attested.
#   4. Build the versioned ROCK (ghcr.io/<owner>/juju-norma:<version>) from the
#      tag with the same reusable workflow publish-edge uses.
#
# charmcraft has no `download` command, so the principal cannot be fetched back
# from latest/candidate (an earlier version of step 3 tried, and would have
# failed on the first tag; juju-norma's v0.0.1-rc1 dry run hit the same bug).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  promote-to-candidate:
    name: Promote latest/edge -> latest/candidate
    runs-on: ubuntu-24.04
    # Most of this is waiting for publish-edge (CI, then the publish itself)
    # when the tag is pushed right after the merge it names.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # edge-carries maps edge's version to a commit
          persist-credentials: false

      # `promote` takes whatever edge holds at that moment. Without this check a
      # tag pushed before its commit's publish finished (or on an older commit)
      # put bits on candidate that the tag does not describe.
      - name: Wait for latest/edge to carry the tagged commit
        id: edge
        env:
          EDGE_WAIT_ATTEMPTS: "180"   # 15 s apart: up to 45 min
        run: |
          set -euo pipefail
          rev=$(scripts/charmhub-edge.sh edge-carries juju-norma-k8s "$GITHUB_SHA")
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic

      - name: charmcraft promote edge -> candidate
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Retry transient CharmHub failures (connection drops mid-call) so an
          # unattended tag release doesn't abort on a blip.
          cc() {
            local rc
            for attempt in 1 2 3 4 5; do
              charmcraft "$@" && return 0
              rc=$?
              echo "charmcraft $1 attempt $attempt failed (rc=$rc); retrying in 20s" >&2
              sleep 20
            done
            echo "charmcraft $1 failed after 5 attempts" >&2
            return 1
          }
          cc promote \
            --name=juju-norma-k8s \
            --from-channel=latest/edge \
            --to-channel=latest/candidate \
            --yes

      # Edge can move between the check and the promote (a merge landing in the
      # same minutes); fail loudly rather than ship an unverified revision.
      - name: Check latest/candidate holds the verified revision
        env:
          EXPECTED: ${{ steps.edge.outputs.revision }}
        run: |
          set -euo pipefail
          actual=$(scripts/charmhub-edge.sh revision juju-norma-k8s candidate)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::latest/candidate holds revision ${actual:-<none>}, not the verified edge revision $EXPECTED;" \
              "edge moved during the promote. Release revision $EXPECTED to latest/candidate by hand."
            exit 1
          fi
          echo "latest/candidate holds revision $actual"

  build-artifacts:
    name: Pack principal + sudoer charms
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # charm `version` part needs git history
          persist-credentials: false

      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic

      - name: Pack principal charm (committed libs, as tested by CI)
        run: |
          charmcraft pack -v
          mv juju-norma-k8s_*.charm principal.charm

      - name: Pack with sudoer overlay
        run: |
          # Swap in the sudoer charmcraft.yaml overlay, pack, restore.
          cp charmcraft.yaml charmcraft-principal.yaml.bak
          cp charmcraft-sudoer.yaml charmcraft.yaml
          charmcraft pack -v
          mv juju-norma-k8s_*.charm juju-norma-k8s-sudoer_amd64.charm
          mv charmcraft-principal.yaml.bak charmcraft.yaml
          mv principal.charm juju-norma-k8s_amd64.charm

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: |
            juju-norma-k8s_amd64.charm
            juju-norma-k8s-sudoer_amd64.charm
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: [promote-to-candidate, build-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write      # create the GitHub Release
      id-token: write       # OIDC token for build-provenance signing
      attestations: write   # record the provenance attestation
    steps:
      # gh release create needs a git repo context (to resolve the repo + tag);
      # this job builds nothing, it just bundles the artifacts into a Release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artifacts

      - name: Generate SHA256SUMS
        run: |
          sha256sum juju-norma-k8s_amd64.charm juju-norma-k8s-sudoer_amd64.charm \
            | tee SHA256SUMS

      - name: Attest build provenance (charms)
        # Signed SLSA provenance for both .charm artifacts; verify with
        # `gh attestation verify <file> --owner <owner>`.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            juju-norma-k8s_amd64.charm
            juju-norma-k8s-sudoer_amd64.charm

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Notes start at the previous v* tag: left to itself, GitHub picks the
          # starting point, and the rev<N> tags publish-edge creates are not it.
          # A hyphenated tag (v0.2.0-rc1) is a pre-release.
          args=(--title "${GITHUB_REF_NAME}" --verify-tag --generate-notes)
          if prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null); then
            args+=(--notes-start-tag "$prev")
          fi
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${args[@]}" \
            juju-norma-k8s_amd64.charm \
            juju-norma-k8s-sudoer_amd64.charm \
            SHA256SUMS

  version:
    name: Read the version from the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  rock:
    name: Build the versioned ROCK
    needs: version
    uses: ./.github/workflows/publish-rock.yaml
    permissions:
      contents: read
      packages: write      # push the images + the attestation to ghcr
      id-token: write       # OIDC token for build-provenance signing
      attestations: write   # record the provenance attestation
    with:
      sha: ${{ github.sha }}
      base: ${{ needs.version.outputs.version }}
