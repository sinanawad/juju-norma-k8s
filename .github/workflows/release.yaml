name: Release

# Triggered on tags v* — produces the principal charm (.charm) and the
# sudoer variant (.charm), uploads the principal to CharmHub edge, and
# attaches both .charm files plus the ROCK to a GitHub Release.
#
# Distribution (decided in spec discussion):
#   - principal (charm-user: non-root) -> CharmHub latest/edge + GH Release
#   - sudoer    (charm-user: sudoer)   -> GH Release only, NEVER CharmHub
#
# Secrets required:
#   CHARMHUB_TOKEN  exported macaroon from `charmcraft login --export`,
#                   scoped to charm=juju-norma-k8s with permissions
#                   package-manage and package-view.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # for creating the GitHub Release
  packages: write   # so we can resolve the matching ROCK from ghcr.io

jobs:
  pack-charms:
    name: Pack charms (principal + sudoer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # charm version comes from `git describe`

      - name: Setup LXD
        uses: canonical/setup-lxd@main

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic

      - name: Fetch charm libs
        run: charmcraft fetch-libs

      - name: Pack principal charm
        run: |
          charmcraft pack
          principal=$(ls juju-norma-k8s_*.charm | head -1)
          mv "$principal" juju-norma-k8s_amd64.charm

      - name: Pack sudoer variant
        run: |
          # Swap charmcraft.yaml for the sudoer overlay, repack, restore.
          cp charmcraft.yaml charmcraft-principal.yaml.bak
          cp charmcraft-sudoer.yaml charmcraft.yaml
          charmcraft pack
          sudoer=$(ls juju-norma-k8s_*.charm | grep -v juju-norma-k8s_amd64.charm | head -1)
          mv "$sudoer" juju-norma-k8s-sudoer_amd64.charm
          mv charmcraft-principal.yaml.bak charmcraft.yaml

      - name: Upload .charm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: charms
          path: "*.charm"
          if-no-files-found: error

  publish-to-charmhub:
    name: Publish principal to CharmHub edge
    needs: pack-charms
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: charms

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic

      - name: Determine OCI resource reference
        id: oci
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          echo "ref=ghcr.io/${{ github.repository_owner }}/juju-norma:${version}" >> "$GITHUB_OUTPUT"

      - name: Upload + release principal charm
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: |
          charmcraft upload juju-norma-k8s_amd64.charm \
            --release=latest/edge \
            --resource="juju-norma-image:${{ steps.oci.outputs.ref }}"

  github-release:
    name: Create GitHub Release
    needs: pack-charms
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: charms

      - name: Create release with both .charm files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            juju-norma-k8s_amd64.charm \
            juju-norma-k8s-sudoer_amd64.charm
