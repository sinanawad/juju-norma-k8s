name: CI

on:
  push:
    branches: [main, "001-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: make lint

  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: make unit
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  pack:
    name: Pack Charm
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup LXD
        uses: canonical/setup-lxd@main
      - name: Install charmcraft
        run: sudo snap install charmcraft --classic
      - run: charmcraft fetch-libs
      - name: Pack principal charm
        run: charmcraft pack
      - name: Pack sudoer variant
        run: |
          mv juju-norma-k8s_*.charm principal.charm
          cp charmcraft.yaml charmcraft-principal.yaml.bak
          cp charmcraft-sudoer.yaml charmcraft.yaml
          charmcraft pack
          mv juju-norma-k8s_*.charm juju-norma-k8s-sudoer_amd64.charm
          cp charmcraft-principal.yaml.bak charmcraft.yaml
          rm charmcraft-principal.yaml.bak
          mv principal.charm juju-norma-k8s_amd64.charm
      - name: Upload charm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: charm
          path: "*.charm"

  build-rock:
    name: Build ROCK
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup LXD
        uses: canonical/setup-lxd@main
      - name: Install rockcraft
        run: sudo snap install rockcraft --classic
      - name: Build ROCK (amd64 only)
        run: rockcraft pack --platform amd64
      - name: Upload ROCK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rock
          path: "*.rock"

  integration:
    name: Integration (${{ matrix.juju-channel }})
    runs-on: ubuntu-24.04
    needs: [unit, pack, build-rock]
    # Integration is workflow_dispatch-only for now — the suite runs
    # ~10 min on Juju 3.6 and ~50 min on Juju 4.0 against a fresh
    # microk8s controller, which is too expensive for every PR. To
    # opt into per-PR integration later, switch this gate to also
    # accept pull_request events and split tests with pytest markers
    # (e.g., -m smoke for a subset).
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        juju-channel: ["3.6/stable", "4.0/stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/download-artifact@v8
        with:
          name: charm
      - uses: actions/download-artifact@v8
        with:
          name: rock
      - run: uv sync --extra dev
      - name: Setup microk8s
        run: |
          sudo snap install microk8s --channel=1.34-strict/stable
          sudo usermod -a -G snap_microk8s $USER
          sudo microk8s status --wait-ready
          sudo microk8s enable dns hostpath-storage registry
      - name: Push ROCK to local registry
        run: |
          sudo snap install rockcraft --classic
          version=$(awk '/^version:/ {gsub(/"/, "", $2); print $2}' rockcraft.yaml)
          rockcraft.skopeo --insecure-policy copy \
            oci-archive:$(ls *.rock) \
            "docker://localhost:32000/juju-norma:${version}" \
            --dest-tls-verify=false
          echo "NORMA_IMAGE=localhost:32000/juju-norma:${version}" >> "$GITHUB_ENV"
      - run: make integration
        timeout-minutes: 80
        env:
          SETUP_ENVIRONMENT: "1"
          JUJU_CHANNEL: ${{ matrix.juju-channel }}
          CHARM_PATH: ${{ github.workspace }}

