name: CI

on:
  push:
    branches: [main, "001-*"]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full integration matrix (3.6/stable, 4.0/stable, 4.0/edge).
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  # Cancel a superseded CI run for the same ref (a new push to a PR/branch
  # supersedes the previous run), freeing runners — including the long
  # microk8s integration job. Nightly/dispatch full runs use distinct refs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: make lint

  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: make unit
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  pack:
    name: Pack Charm
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - name: Setup LXD
        uses: canonical/setup-lxd@main
      - name: Install charmcraft
        run: sudo snap install charmcraft --classic
      - run: charmcraft fetch-libs
      - name: Pack principal charm
        run: charmcraft pack
      - name: Pack sudoer variant
        run: |
          mv juju-norma-k8s_*.charm principal.charm
          cp charmcraft.yaml charmcraft-principal.yaml.bak
          cp charmcraft-sudoer.yaml charmcraft.yaml
          charmcraft pack
          mv juju-norma-k8s_*.charm juju-norma-k8s-sudoer_amd64.charm
          cp charmcraft-principal.yaml.bak charmcraft.yaml
          rm charmcraft-principal.yaml.bak
          mv principal.charm juju-norma-k8s_amd64.charm
      - name: Upload charm artifacts
        uses: actions/upload-artifact@v7
        with:
          name: charm
          path: "*.charm"

  build-rock:
    name: Build ROCK
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - name: Setup LXD
        uses: canonical/setup-lxd@main
      - name: Install rockcraft
        run: sudo snap install rockcraft --classic
      - name: Build ROCK (amd64 only)
        run: rockcraft pack --platform amd64
      - name: Upload ROCK artifact
        uses: actions/upload-artifact@v7
        with:
          name: rock
          path: "*.rock"

  # Decide the integration matrix from the triggering event:
  #   - pull_request / push        -> fast smoke subset on Juju 4.0/edge
  #                                    (the engine-under-test: regressions land
  #                                    in edge first). ~one deploy + a handful of
  #                                    quick assertions.
  #   - schedule / workflow_dispatch -> full 18-suite matrix across
  #                                    3.6/stable, 4.0/stable, 4.0/edge.
  integration-matrix:
    name: Decide integration matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'matrix={"include":[{"channel":"3.6/stable","mode":"full"},{"channel":"4.0/stable","mode":"full"},{"channel":"4.0/edge","mode":"full"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"channel":"4.0/edge","mode":"smoke"}]}' >> "$GITHUB_OUTPUT"
          fi

  integration:
    name: Integration (${{ matrix.channel }} ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    needs: [unit, pack, build-rock, integration-matrix]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.integration-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/download-artifact@v8
        with:
          name: charm
      - uses: actions/download-artifact@v8
        with:
          name: rock
      - run: uv sync --extra dev
      - name: Setup microk8s
        run: |
          sudo snap install microk8s --channel=1.34-strict/stable
          sudo usermod -a -G snap_microk8s $USER
          sudo microk8s status --wait-ready
          sudo microk8s enable dns hostpath-storage registry
      - name: Push ROCK to local registry
        run: |
          sudo snap install rockcraft --classic
          version=$(awk '/^version:/ {gsub(/"/, "", $2); print $2}' rockcraft.yaml)
          rockcraft.skopeo --insecure-policy copy \
            oci-archive:$(ls *.rock) \
            "docker://localhost:32000/juju-norma:${version}" \
            --dest-tls-verify=false
          echo "NORMA_IMAGE=localhost:32000/juju-norma:${version}" >> "$GITHUB_ENV"
      # `make integration-smoke` (-m smoke) for the fast PR/push subset;
      # `make integration` for the full nightly/dispatch matrix. JUJU_CHANNEL
      # drives BOTH the juju client snap AND the bootstrapped controller image
      # (via setup_env), so `4.0/edge` here means an edge controller too.
      - name: Run integration (${{ matrix.mode }})
        run: make integration${{ matrix.mode == 'smoke' && '-smoke' || '' }}
        timeout-minutes: 80
        env:
          SETUP_ENVIRONMENT: "1"
          JUJU_CHANNEL: ${{ matrix.channel }}
          CHARM_PATH: ${{ github.workspace }}

