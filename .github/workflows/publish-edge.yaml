name: Publish to latest/edge

# Continuous publish: every successful push to main produces a fresh
# revision on latest/edge so consumers (notably Juju CI) always have
# the bleeding edge. Promotion to higher risk levels (candidate, stable)
# happens via release-tag.yaml (on git tags) or promote.yaml (manual).
#
# Chained via workflow_run so the ROCK on ghcr.io is fresh before the
# charm's OCI resource is attached. If publish-rock fails on a commit,
# this workflow does not run for that commit — preventing a charm
# revision pointing at a stale OCI image.

on:
  workflow_run:
    workflows: ["Publish ROCK"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # Serialize CharmHub latest/edge uploads so two publishes can't race the
  # channel pointer. Never cancel an in-flight upload — let it finish; the
  # newest pending run (latest charm revision) runs after and wins. Belt-and-
  # suspenders: publish-rock's concurrency already collapses main-push bursts.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write   # canonical/charming-actions/upload-charm pushes a git tag
                    # ("rev<N>-<sha>") for each new charm revision; without
                    # write the action fails with "Resource not accessible".

jobs:
  publish:
    name: Publish principal charm to latest/edge
    runs-on: ubuntu-24.04
    # Only on workflow_run success, or any workflow_dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # charm `version` part needs git history

      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic

      - name: Fetch charm libs
        run: charmcraft fetch-libs

      - name: Pack principal charm
        run: charmcraft pack -v

      - name: Upload + release to latest/edge
        uses: canonical/charming-actions/upload-charm@1753e0803f70445132e92acd45c905aba6473225 # 2.7.0
        with:
          credentials: ${{ secrets.CHARMHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          channel: latest/edge
          built-charm-path: juju-norma-k8s_amd64.charm

  # Deliver publish failures. The publish chain (publish-rock -> publish-edge) is
  # unattended, and publish-edge sat red from 2026-09-02 to 2026-10-09 (charmcraft 4.4
  # invalidated the Candid-issued CHARMHUB_TOKEN) with nobody told. Deliberately quiet,
  # like the nightly verdict: ONE reused issue per red streak (per workflow), its body
  # rewritten with the latest failing run, closed automatically on the next success.
  # Skipped runs are not failures and stay silent.
  notify:
    name: Publish failure issue
    needs: [publish]
    if: >-
      always() &&
      (contains(needs.*.result, 'failure') ||
       (!contains(needs.*.result, 'skipped') && !contains(needs.*.result, 'cancelled')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the publish-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          TITLE: ${{ github.workflow }} is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # $ENV.TITLE is a jq variable, not shell
          num=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
                  --jq 'map(select(.title == $ENV.TITLE)) | .[0].number // empty')
          if [ "$RESULT" = failure ]; then
            body="Latest failing run ($(date -u +%F)): $RUN_URL

          This issue stays open, and is updated, for as long as publishing keeps failing; it closes itself on the next successful run.
          If the log shows \`Invalid macaroon\` or another store auth error, the CharmHub token needs (CHARMHUB_TOKEN) re-exporting with the current charmcraft (see the charmcraft 4.4 Candid -> Ubuntu One migration)."
            if [ -n "$num" ]; then
              gh issue edit "$num" --body "$body"
            else
              gh issue create --title "$TITLE" --body "$body"
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Recovered: $RUN_URL"
          fi
